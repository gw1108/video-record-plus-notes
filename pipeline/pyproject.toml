[build-system]
requires = ["setuptools>=70.1"]
build-backend = "setuptools.build_meta"

[project]
name = "playtest-pipeline"
version = "0.1.0"
description = "Post-session pipeline: extract mic track, VAD, speech-to-text, FFmpeg condensed cut + cut map, report bundle (player page), Notion handoff."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-only" }
authors = [{ name = "George", email = "georgetw1108@gmail.com" }]

# The selected Windows release wheel carries FFmpeg. Source/editable installs resolve an external copy via PLAYTEST_FFMPEG_DIR or PATH. STT and VAD are optional heavyweight extras; the pipeline degrades gracefully without them (notes fall back to empty text; segments come from marks alone).
dependencies = []

[project.optional-dependencies]
stt = ["faster-whisper>=1.0"]
vad = ["silero-vad>=5.1"]
# The uploader is opt-in: without these `playtest-youtube status` and `upload --dry-run` still work, everything else says how to install them.
youtube = ["google-auth>=2.30", "google-auth-oauthlib>=1.2", "google-api-python-client>=2.140"]
all = ["faster-whisper>=1.0", "silero-vad>=5.1", "google-auth>=2.30", "google-auth-oauthlib>=1.2", "google-api-python-client>=2.140"]

[project.scripts]
playtest-pipeline = "playtest_pipeline.cli:main"
playtest-youtube = "playtest_pipeline.youtube_cli:main"

[tool.setuptools.packages.find]
include = ["playtest_pipeline*"]

# The release builder places the selected BtbN LGPL ffmpeg.exe, ffprobe.exe, and LICENSE.txt in this ignored directory before building the Windows-only wheel. media.py prefers these package files over PATH.
[tool.setuptools.package-data]
playtest_pipeline = ["bin/*", "report-template.html"]
