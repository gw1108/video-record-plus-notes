# Minimal static host for playtest report bundles (tech-stack report §5.0/§5.5).
# Serves <root>/<session>/report/{report.html, condensed.mp4, chapters.vtt, *.json}.
# Drop into /etc/nginx/conf.d/playtest.conf (or include from the http {} block).
#
# HTTP Range: nginx serves static files with Range support (Accept-Ranges:
# bytes) out of the box — nothing to enable; the player seeks via Range.

server {
    listen 80;
    listen [::]:80;
    server_name reports.example.com;   # put TLS in front (certbot / a reverse proxy);
                                       # Notion is https, so the embed URL must be https too.

    root /srv/playtest;   # e.g. /srv/playtest/2026-08-23_114134_m1-live/report/report.html

    # report.html is self-contained (data inlined, no css/js siblings), so an
    # explicit map of just the bundle's types is enough — and guarantees .mp4
    # and .vtt are right regardless of the distro's mime.types.
    types {
        text/html         html;
        video/mp4         mp4;
        text/vtt          vtt;
        application/json  json;
    }
    default_type application/octet-stream;

    # Framing (tech-stack §5.0): Notion renders API-created embed blocks as
    # plain iframes and skips iFramely validation, so a page that refuses to
    # be framed silently renders blank inside Notion. Do NOT add
    # X-Frame-Options here; allow Notion's domains explicitly instead (the app
    # moved to app.notion.com in 2026 — the API returns those URLs — and public
    # pages live on *.notion.site).
    add_header Content-Security-Policy "frame-ancestors 'self' https://*.notion.so https://*.notion.com https://*.notion.site" always;

    location / {
        try_files $uri $uri/ =404;
    }

    # condensed.mp4 is often hundreds of MB (≈330 MB/min at CQP-18 1080p60).
    # Never gzip video: it's already compressed and on-the-fly gzip disables
    # Range. (nginx only gzips gzip_types anyway; this makes it explicit.)
    location ~* \.mp4$ {
        gzip off;
        sendfile on;
        tcp_nopush on;
        expires 1d;
    }
}
